name: Build Android APK

on:
  push:
    paths: ["godot/**", "android-ads-plugin/**", ".github/workflows/godot.yml"]
  pull_request:
    paths: ["godot/**", "android-ads-plugin/**", ".github/workflows/godot.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5.1"
  # Set when the upload key is stored as repository secrets (see the Google Play bundle step).
  UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the AdMob plugin
        run: |
          cd android-ads-plugin
          gradle --no-daemon :plugin:assembleRelease
          mkdir -p ../godot/addons/neon_ads/bin
          cp plugin/build/outputs/aar/plugin-release.aar ../godot/addons/neon_ads/bin/neon-ads-release.aar

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfLO $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSfLO $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Install Godot and Android settings
        run: |
          cd ~/godot-dl
          unzip -oq Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $tpl
          unzip -oq Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt'
          mv templates/* $tpl/
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Import project
        run: godot --headless --path godot --import || true

      - name: Run game rule tests
        run: godot --headless --path godot -s tests/sim.gd

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          # Test builds use the release engine (faster, smaller) signed with the debug key.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          # Install Godot's Android build template by hand, so we can tweak it first:
          # compressing the engine library roughly halves the download.
          mkdir -p godot/android/build godot/build
          unzip -oq ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d godot/android/build
          echo -n "${GODOT_VERSION}.stable" > godot/android/.build_version
          touch godot/android/.gdignore
          printf '\nandroid {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging true\n        }\n    }\n}\n' >> godot/android/build/build.gradle
          # Google Play needs the newest Android target (API 36), so compile against it too.
          sed -i -E 's/(compileSdk *: *)[0-9]+/\136/; s/(buildTools *: *)"[^"]*"/\1"36.0.0"/' godot/android/build/config.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> godot/android/build/gradle.properties
          grep -nE "compileSdk|targetSdk|buildTools" godot/android/build/config.gradle
          # Play Console's version number goes up with every CI run.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
          godot --headless --path godot --export-release "Android" build/bartender-academy.apk
          ls -la godot/build

      - name: Check the ads plugin is inside the APK
        run: |
          aapt2=$(ls $ANDROID_SDK_ROOT/build-tools/*/aapt2 | tail -1)
          $aapt2 dump xmltree --file AndroidManifest.xml godot/build/bartender-academy.apk > manifest.txt
          grep -q "org.godotengine.plugin.v2.NeonAds" manifest.txt
          grep -q "com.google.android.gms.ads.APPLICATION_ID" manifest.txt
          unzip -p godot/build/bartender-academy.apk 'classes*.dex' | grep -aq "com/vedshubham/neonads/NeonAds"
          echo "AdMob plugin found in the APK"
          ls -la godot/build/bartender-academy.apk
          # Compressed native libraries only install if the app may extract them.
          if unzip -v godot/build/bartender-academy.apk "lib/*" | grep -q Defl; then grep -iE "extractNativeLibs.*(true|0xffffffff)" manifest.txt; fi
          # Google Play rejects native code that isn't aligned for 16 KB memory pages.
          mkdir -p libcheck && unzip -oq godot/build/bartender-academy.apk 'lib/*' -d libcheck
          for so in libcheck/lib/*/*.so; do
            align=$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u)
            echo "$so: $align"
            for a in $align; do [ $((a)) -ge 16384 ] || { echo "not 16 KB aligned: $so"; exit 1; }; done
          done
          grep -E "targetSdkVersion|minSdkVersion" manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bartender-academy-apk
          path: godot/build/bartender-academy.apk

      # A fixed download link for phones:
      # https://github.com/<owner>/<repo>/releases/download/test-build/bartender-academy.apk
      - name: Publish test APK as a download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp godot/build/bartender-academy.apk bartender-academy.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build bartender-academy.apk --prerelease \
            --title "Bartender Academy test build" \
            --notes "Test build from ${GITHUB_SHA::7}."

      # The Google Play upload (.aab) with real ads, signed with the upload key.
      # Needs the UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD repository secrets.
      - name: Export Google Play bundle
        if: github.event_name != 'pull_request' && env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: upload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > /home/runner/upload.keystore
          godot --headless --path godot --export-release "Android Store" build/bartender-academy.aab
          rm /home/runner/upload.keystore
          ls -la godot/build/bartender-academy.aab

      - name: Publish Google Play bundle as a download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('godot/build/bartender-academy.aab') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp godot/build/bartender-academy.aab bartender-academy.aab
          gh release delete store-build --yes --cleanup-tag || true
          gh release create store-build bartender-academy.aab --prerelease \
            --title "Bartender Academy Google Play bundle" \
            --notes "Upload this .aab to Play Console. Version code ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA::7}."
